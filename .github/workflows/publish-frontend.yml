name: Build frontend Docker image

on:
  push:
    branches: ["main"]
    paths:
      # A submodule bump changes the gitlink entry `frontend/sumi-ui` itself
      # in the diff, and GitHub Actions' path-filter globs treat `**` as
      # matching zero or more path segments, so this already matches it --
      # `.gitmodules` below is only for a change to the submodule's own
      # config (e.g. its URL), which lives at the repo root instead.
      - "frontend/**"
      - ".gitmodules"
      - ".github/workflows/publish-frontend.yml"
    tags: ["v*.*.*"]

  # A PR build with no push: there is no Docker in this dev environment, so a
  # broken Dockerfile would otherwise only surface once it lands on main.
  pull_request:
    paths:
      - "frontend/**"
      - ".gitmodules"
      - ".github/workflows/publish-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # `submodules: true` so `frontend/sumi-ui` is checked out -- the
      # library has no npm package, the app compiles its TypeScript source
      # directly (see sumi-ui's README). The repo is public, so this needs
      # no extra token.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # QEMU lets buildx produce the arm64 variant on this amd64 runner (Apple
      # Silicon Macs, issue tkober/compose-stacks-unraid#19).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Skipped on a PR: it carries no credentials to push with, and GHCR
      # login is pointless (and would fail for a fork PR) when nothing below
      # pushes anyway.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tkober/kanji-trainer-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          # The frontend builds from its own directory — unlike the backend,
          # nothing outside it is copied in.
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          # Build-only on a PR, so a broken Dockerfile shows up in the PR
          # instead of only failing once it reaches main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
