<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kanji Trainer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- The tab mark, inline: white 漢 on the app's own kanji colour. Same mark
       as the icons in public/, which is what a home screen uses; those are
       PNGs because a manifest icon cannot be an SVG everywhere. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23f100a1%22/><text x=%2250%22 y=%2272%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22system-ui,sans-serif%22>漢</text></svg>">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- The browser chrome around the app, not the icon: these match `--bg`, so
       an installed window looks like one surface rather than a framed page. -->
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
</head>
<body>
  <app-root></app-root>
</body>
</html>
