@if (open()) {
  <div class="panel" role="dialog" aria-label="Hotkeys">
    <h2>Hotkeys</h2>
    <ul>
      @for (hotkey of hotkeys(); track hotkey.label) {
        <li>
          <span class="keys">
            @for (key of hotkey.keys; track key) {
              <kbd>{{ key }}</kbd>
            }
          </span>
          <span class="label">{{ hotkey.label }}</span>
        </li>
      }
    </ul>
  </div>
}

<button
  type="button"
  class="toggle"
  appHoldFocus
  aria-label="Hotkeys"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <rect
      x="2"
      y="6"
      width="20"
      height="12"
      rx="2"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
    />
    <path
      d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M6 14h.01M9 14h.01M12 14h8"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
    />
  </svg>
</button>
