<sumi-app-shell [brand]="brand" [nav]="nav()">
  @if (level() !== null) {
    <a sumiShellActions routerLink="/lessons" title="The lowest level with lessons left">
      <sumi-badge tone="accent">Level {{ level() }}</sumi-badge>
    </a>
  }

  <sumi-app-switcher sumiShellSwitcher />

  <router-outlet />
</sumi-app-shell>
